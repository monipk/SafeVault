name: safe_vault
description: A private, local-first personal organizer.
publish_to: none
version: 1.3.0+4
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  drift: 2.35.0
  drift_flutter: 0.3.1
  flutter_secure_storage: 11.2.0
  local_auth: 3.0.2
  flutter_local_notifications: 22.3.1
  flutter_timezone: 5.1.0
  timezone: 0.11.1
  cryptography: ^2.7.0
  file_picker: 13.1.0
  intl: ^0.20.3
  uuid: ^4.6.0
  pdf: ^3.11.3
  pdfrx: 2.6.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/branding/icon.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  min_sdk_android: 24
  adaptive_icon_background: '#112D32'
  adaptive_icon_foreground: assets/branding/foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: '#112D32'
    theme_color: '#112D32'
  windows:
    generate: true
    image_path: assets/branding/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/icon.png
